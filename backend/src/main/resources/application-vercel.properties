# Vercel default profile: stateless demo/runtime database.
# For persistent production data, switch to the PostgreSQL production profile
# and provide DB_* environment variables (or adapt to your managed database).
spring.datasource.url=jdbc:h2:mem:nirmaansetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false

spring.flyway.locations=classpath:db/migration
spring.flyway.url=jdbc:h2:mem:nirmaansetu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER,VALUE
spring.flyway.user=sa
spring.flyway.password=

logging.level.com.nirmaansetu=INFO
logging.level.org.springframework.security=WARN
