spring.application.name=NirmaanSetu

# Server: Vercel containers provide PORT (default 80). Local fallback is 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# Profile can be overridden in Vercel/project settings.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:vercel}

# JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# File size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Security / demo settings. Override JWT_SECRET in production.
nirmaansetu.jwt.secret=${JWT_SECRET:NirmaanSetu-Change-Me-Use-a-Strong-Secret-in-Production}
nirmaansetu.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
nirmaansetu.demo-mode=${DEMO_MODE:true}
